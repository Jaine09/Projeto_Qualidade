<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Cadastrar Livro</title>

    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/cadastrarLivro.css}" />
  </head>
  <body>
    <div class="tabbarcontainer">
      <div class="screen">
        <a th:href="@{/home}" class="go-back-button">
          <img class="go-back-icon" alt="Voltar" th:src="@{/img/voltar.png}" />
        </a>

        <h3 class="cadastrar-livro">Cadastrar livro</h3>
      </div>

      <form th:action="@{/salvar}" th:object="${livro}" method="post">
        <section class="book-details">
          <div class="rectangle-parent">
            <div class="form-content">
              <div class="top-section">
                <div class="rectangle-group">
                  <div class="image-upload-section">
                    <img
                      id="previewImagem"
                      class="book-preview"
                      th:src="@{/img/adicionarImagem.png}"
                      alt="Prévia da capa"
                    />

                    <input
                      class="author-input"
                      type="text"
                      th:field="*{imagem}"
                      id="imagemInput"
                      placeholder="Cole a URL da capa do livro"
                    />
                  </div>
                </div>

                <div class="author-field-parent">
                  <div class="field-group">
                    <label class="label-text">Título</label>
                    <input
                      class="author-input"
                      type="text"
                      th:field="*{titulo}"
                      required
                    />
                  </div>

                  <div class="field-group">
                    <label class="label-text">Autor</label>
                    <input
                      class="author-input"
                      type="text"
                      th:field="*{autor}"
                      required
                    />
                  </div>

                  <div class="field-group">
                    <label class="label-text">Gênero</label>
                    <input
                      class="author-input"
                      type="text"
                      th:field="*{genero}"
                      required
                    />
                  </div>
                </div>
              </div>

              <div class="description-section">
                <label class="label-text">Descrição</label>
                <textarea
                  class="description-input"
                  th:field="*{descricao}"
                ></textarea>
              </div>
            </div>

            <div class="action-buttons">
              <button type="submit" class="rectangle-container">
                <span class="salvar">Salvar</span>
              </button>
            </div>
          </div>
        </section>
      </form>
    </div>
    <script>
      const imagemInput = document.getElementById("imagemInput");
      const preview = document.getElementById("previewImagem");

      imagemInput.addEventListener("input", () => {
        const url = imagemInput.value.trim();

        if (url !== "") {
          preview.src = url;
        } else {
          preview.src = "/img/adicionarImagem.png";
        }
      });
    </script>
  </body>
</html>
