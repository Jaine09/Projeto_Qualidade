<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Editar Livro</title>

    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/editarLivros.css}" />
  </head>

  <body>
    <div class="root">
      <div class="rectangle-parent">
        <a th:href="@{/home}" class="go-back-button">
          <img class="go-back-icon" alt="Voltar" th:src="@{/img/voltar.png}" />
        </a>

        <h3 class="editar-livro">Editar livro</h3>
      </div>

      <form
        th:action="@{/editar/{id}(id=${livro.id})}"
        th:object="${livro}"
        method="post"
      >
        <input type="hidden" th:field="*{id}" />

        <section class="root-inner">
          <div class="rectangle-group">
            <div class="form-content">
              <div class="top-inputs">
                <div class="image-upload-placeholder">
                  <img
                    id="previewImagem"
                    class="book-preview"
                    alt="Prévia da capa"
                    th:src="${livro.imagem != null && !#strings.isEmpty(livro.imagem)}
                                        ? ${livro.imagem}
                                        : @{/img/adicionarImagem.png}"
                  />

                  <input
                    class="input-field image-url-input"
                    type="text"
                    th:field="*{imagem}"
                    id="imagemInput"
                    placeholder="Cole a URL da capa do livro"
                  />
                </div>

                <div class="author-genre-fields">
                  <div class="field-group">
                    <label class="label-text">Título</label>
                    <input
                      class="input-field"
                      type="text"
                      th:field="*{titulo}"
                      required
                    />
                  </div>

                  <div class="field-group">
                    <label class="label-text">Autor</label>
                    <input
                      class="input-field"
                      type="text"
                      th:field="*{autor}"
                      required
                    />
                  </div>

                  <div class="field-group">
                    <label class="label-text">Gênero</label>
                    <input
                      class="input-field"
                      type="text"
                      th:field="*{genero}"
                      required
                    />
                  </div>
                </div>
              </div>

              <div class="description-section">
                <label class="label-text">Descrição</label>
                <textarea
                  class="description-input"
                  th:field="*{descricao}"
                ></textarea>
              </div>
            </div>

            <div class="button-wrapper">
              <button type="submit" class="save-button">
                Salvar Alterações
              </button>
            </div>
          </div>
        </section>
      </form>
    </div>

    <script>
      const imagemInput = document.getElementById("imagemInput");
      const preview = document.getElementById("previewImagem");

      function ajustarPreview() {
        const url = imagemInput.value.trim();

        if (url !== "") {
          preview.src = url;
          preview.style.objectFit = "cover";
          preview.style.padding = "0";
        } else {
          preview.src = "/img/adicionarImagem.png";
          preview.style.objectFit = "contain";
          preview.style.padding = "24px";
        }
      }

      imagemInput.addEventListener("input", ajustarPreview);
      window.addEventListener("load", ajustarPreview);
    </script>
  </body>
</html>
