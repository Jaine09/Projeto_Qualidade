<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Minha Biblioteca</title>

    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/paginaInicial.css}" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    />
  </head>

  <body>
    <div class="intro-to-journal">
      <div class="rectangle-parent">
        <a th:href="@{/logout}" class="frame-wrapper">
          <div class="abertura-da-porta-aberta-1-parent">
            <img
              class="abertura-da-porta-aberta-1-icon"
              alt="Sair"
              th:src="@{/img/sair.png}"
            />

            <div class="sair-wrapper">
              <b class="sair">Sair</b>
            </div>
          </div>
        </a>

        <h2 class="minha-biblioteca">Minha Biblioteca</h2>
      </div>

      <section class="intro-to-journal-inner">
        <div class="frame-parent">
          <div class="frame-group">
            <div class="rounded-rectangle-parent">
              <input
                class="buscar"
                id="buscarLivro"
                placeholder="Buscar por título, gênero ou autor"
                type="text"
              />

              <img
                class="search-icon"
                alt="Buscar"
                th:src="@{/img/buscar.png}"
              />
            </div>

            <div class="frame-container">
              <a th:href="@{/novo}" class="rectangle-group">
                <b class="novo">Novo</b>
              </a>
            </div>
          </div>

          <div class="rectangle-container">
            <div class="frame-div" th:each="livro : ${livros}">
              <div class="book-cover-wrapper">
                <img
                  class="book-cover"
                  alt="Capa do livro"
                  th:src="${livro.imagem != null && !#strings.isEmpty(livro.imagem)}
                                    ? ${livro.imagem}
                                    : @{/img/adicionarImagem.png}"
                />
              </div>

              <div class="ttulo-parent">
                <b class="ttulo" th:text="${livro.titulo}">Título</b>

                <div class="autor" th:text="${livro.autor}">Autor</div>

                <div class="gnero" th:text="${livro.genero}">Gênero</div>

                <p class="descricao" th:text="${livro.descricao}">
                  Descrição do livro
                </p>
              </div>

              <div class="actions-icons">
                <a
                  th:href="@{/editar/{id}(id=${livro.id})}"
                  class="icon-button"
                >
                  <img
                    class="action-icon"
                    alt="Editar"
                    th:src="@{/img/editar.png}"
                  />
                </a>

                <form
                  th:action="@{/deletar/{id}(id=${livro.id})}"
                  method="post"
                >
                  <button type="submit" class="icon-button">
                    <img
                      class="action-icon"
                      alt="Excluir"
                      th:src="@{/img/excluir.png}"
                    />
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const busca = document.getElementById("buscarLivro");

      busca.addEventListener("keyup", () => {
        const valor = busca.value.toLowerCase();
        const livros = document.querySelectorAll(".frame-div");

        livros.forEach((livro) => {
          const texto = livro.innerText.toLowerCase();

          livro.style.display = texto.includes(valor) ? "flex" : "none";
        });
      });
    </script>
  </body>
</html>
