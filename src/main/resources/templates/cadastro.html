<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro</title>

    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/cadastro.css}" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>

  <body>
    <div class="landing-page">
      <img
        class="view-books-arrangement-1-icon"
        alt=""
        th:src="@{/img/imgFundo.webp}"
      />

      <form
        th:action="@{/cadastro}"
        th:object="${usuario}"
        method="post"
        class="rectangle-parent"
      >
        <h2 class="faa-seu-cadastro">Crie sua conta</h2>
        <p class="subtitle">Preencha seus dados para acessar a biblioteca.</p>

        <div th:if="${erro}" class="error-message">
          <span th:text="${erro}"></span>
        </div>

        <div class="form">
          <input
            class="fields"
            th:field="*{nome}"
            placeholder="Nome"
            type="text"
            required
          />
          <input
            class="fields"
            th:field="*{email}"
            placeholder="E-mail"
            type="email"
            required
          />

          <div class="cep-group">
            <input
              class="fields cep-input"
              th:field="*{cep}"
              id="cep"
              placeholder="CEP"
              type="text"
              required
            />
            <button type="button" id="buscarCepBtn" class="cep-button">
              Buscar
            </button>
          </div>

          <input
            class="fields"
            th:field="*{endereco}"
            id="endereco"
            placeholder="Endereço"
            type="text"
            readonly
          />
          <input
            class="fields"
            th:field="*{cidade}"
            id="cidade"
            placeholder="Cidade"
            type="text"
            readonly
          />
          <input
            class="fields"
            th:field="*{estado}"
            id="estado"
            placeholder="Estado"
            type="text"
            readonly
          />

          <input
            class="fields"
            th:field="*{senha}"
            placeholder="Senha"
            type="password"
            required
          />
          <input
            class="fields"
            placeholder="Confirmar senha"
            type="password"
            required
          />
        </div>

        <button type="submit" class="submit-button">Cadastrar</button>
      </form>
    </div>

    <script>
      document
        .getElementById("buscarCepBtn")
        .addEventListener("click", async function () {
          const cepInput = document.getElementById("cep");
          const enderecoInput = document.getElementById("endereco");
          const cidadeInput = document.getElementById("cidade");
          const estadoInput = document.getElementById("estado");
          const botao = document.getElementById("buscarCepBtn");

          const cep = cepInput.value.replace(/\D/g, "");

          if (cep.length !== 8) {
            alert("Digite um CEP válido com 8 números.");
            return;
          }

          try {
            botao.textContent = "Buscando...";
            botao.disabled = true;

            const response = await fetch(`/api/cep/${cep}`);

            if (!response.ok) {
              throw new Error("CEP não encontrado");
            }

            const data = await response.json();

            enderecoInput.value = data.logradouro || "";
            cidadeInput.value = data.localidade || "";
            estadoInput.value = data.uf || "";
          } catch (error) {
            alert("Não foi possível buscar o CEP.");
          } finally {
            botao.textContent = "Buscar";
            botao.disabled = false;
          }
        });
    </script>
  </body>
</html>
